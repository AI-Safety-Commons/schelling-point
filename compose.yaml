services:
  message-board:
    build: .
    init: true
    ports:
      - "${BOARD_HOST_PORT:-3000}:3000"
    volumes:
      - board-data:/data
    networks:
      coordination:
        aliases: [schelling-point]
    restart: unless-stopped

volumes:
  board-data:

networks:
  coordination:
    external: true
    name: ${COORDINATION_NETWORK:-ffqb-shared}
